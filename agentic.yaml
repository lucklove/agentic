# Global configuration shared across all profiles.
# Profile-specific settings (token, model, instructions, …) live in profiles/<name>.yaml.

gitea:
  base_url: "http://gitea.ai"
  mcp:
    # Command to launch the Gitea MCP server via stdio.
    # Environment variables GITEA_HOST and GITEA_ACCESS_TOKEN are injected
    # automatically per-profile at runtime.
    command: ["go", "run", "gitea.ai/autonomous/gitea-mcp@main", "-t", "stdio"]

# Default working directory for tool/command execution. Relative paths are
# resolved from this file's directory. Profiles can override this value.
working_dir: "."

# Directory that contains all available skills (subdirs with SKILL.md).
# SkillsCapability will discover skills from here; each profile filters
# by name via capabilities.skills.names.
skills_dir: "./skills"

# Capabilities enabled for all profiles by default. Profile entries with the
# same capability name replace the complete global config for that capability.
capabilities:
  code_exec:
  gitea:
  openai_compaction:
    token_threshold: 150000
  anthropic_compaction:
    token_threshold: 150000
  privacy:
    enabled: true
    placeholder_prefix: "__VG_"
    session:
      ttl: "1h"
      max_mappings: 100000
    patterns:
      keywords: []
      regex:
        - pattern: "sk-[A-Za-z0-9]{48,}"
          category: "OPENAI_KEY"
        - pattern: "(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}"
          category: "GITHUB_TOKEN"
        - pattern: "AKIA[0-9A-Z]{16}"
          category: "AWS_ACCESS_KEY"
        - pattern: "(?i)aws.{0,20}['\"][0-9a-zA-Z/+]{40}['\"]"
          category: "AWS_SECRET_KEY"
        - pattern: "xox[baprs]-[0-9A-Za-z\\-]{10,}"
          category: "SLACK_TOKEN"
        - pattern: "eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
          category: "JWT_TOKEN"
        - pattern: "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----[\\s\\S]+?-----END (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
          category: "SSH_PRIVATE_KEY"
      builtin: ["email", "china_phone", "china_id", "uuid", "ipv4", "mac"]
      exclude: ["example.com", "localhost", "127.0.0.1", "0.0.0.0"]
