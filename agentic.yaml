# Global configuration shared across all profiles.
# Profile-specific settings (token, model, instructions, …) live in profiles/<name>.yaml.

gitea:
  base_url: "http://gitea.ai"
  mcp:
    # Command to launch the Gitea MCP server via stdio.
    # Environment variables GITEA_HOST and GITEA_ACCESS_TOKEN are injected
    # automatically per-profile at runtime.
    command: ["go", "run", "gitea.ai/autonomous/gitea-mcp@main", "-t", "stdio"]

# Directory that contains all available skills (subdirs with SKILL.md).
# SkillsCapability will discover skills from here; each profile filters
# by name via capabilities.skills.names.
skills_dir: "./skills"

# Capabilities enabled for all profiles by default. Profile entries with the
# same capability name replace the complete global config for that capability.
capabilities:
  code_exec:
