name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  checks:
    runs-on: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Run formatter and require clean diff
        run: |
          make fmt
          git diff --exit-code

      - name: Run lint checks
        run: make check

      - name: Run type checks
        run: make typecheck

      - name: Run tests
        run: make test
